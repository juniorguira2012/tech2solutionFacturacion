services:
  postgres:
    image: postgres:15-alpine
    container_name: tech2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tech2_pass_2024
      POSTGRES_DB: tech2_prueba_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tech2-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tech2solution.com
      PGADMIN_DEFAULT_PASSWORD: Admin@2026
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
